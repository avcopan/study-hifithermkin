[project]
name = "hifithermkin"
version = "0.0.0"
readme = "README.md"  # the PyPI page
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andreas V. Copan", email = "avcopan@uga.edu"}]
dependencies = [
    "autogeom>=0.0.3",
    "autostorage>=0.0.24",
    "h5py>=3.10",
    "numpy>=2.2.0",
    "pint>=0.24",
    "protomol>=0.0.3",
    "qccodec>=0.22.0",
    "qcdata>=0.24.0",
    "qcref>=0.5.1",
    "rdkit>=2024.3",
]
requires-python = ">= 3.13"

[project.entry-points."qccodec.codecs"]
gaussian = "hifithermkin.gaussian:codec"

[project.urls]
Repository = "https://github.com/avcopan/study-hifithermkin"
Documentation = "https://avcopan.github.io/study-hifithermkin/"

[build-system]
build-backend = "uv_build"
requires = ["uv_build"]

# Ruff configurations
[tool.ruff]
extend-exclude = [".agents", ".claude"]  # vendored agent skills

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # missing trailing comma (handled by format)
    "TID252",   # relative import
    "D203",     # conflict: incorrect blank line before class (uses D211 instead)
    "D213",     # conflict: multi-line summary second line (uses D212 instead)
    "CPY001",   # copyright notice
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "PLR2004", "D103"]  # assert, magic values, docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ty configurations
[tool.ty.environment]
python = ".pixi/envs/test/bin/python"

[tool.ty.src]
include = [
    "src",
    "tests",
]

# Import-linter configurations
[tool.importlinter]
root_package = "hifithermkin"

[[tool.importlinter.contracts]]
name = "Module Layering"
type = "layers"
layers = [
    "hifithermkin.gaussian",
]

# Pytest configurations
[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=hifithermkin",
    "--cov-report=term-missing",
    "--cov-report=html",
]
doctest_optionflags = "NORMALIZE_WHITESPACE"

# Pytest-cov configurations
[tool.coverage.run]
branch = true
source = ["hifithermkin"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
